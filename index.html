<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>입체도형 분류기</title>
  <style>
    :root {
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7ff;
      color: #1d2440;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(29, 36, 64, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 3.8vw, 2rem);
    }

    p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .notice {
      background: #eef4ff;
      border: 1px solid #cddcff;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
    }

    .media-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .preview-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: #edf1fb;
      border: 2px dashed #c6d3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5d6a8a;
      text-align: center;
      padding: 10px;
    }

    video,
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .btn,
    .file-btn {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      padding: 12px;
    }

    .btn-primary { background: #325eff; color: #fff; }
    .btn-danger { background: #e64545; color: #fff; }
    .btn-neutral { background: #e4ebff; color: #23315d; }

    .btn:disabled,
    .file-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #36a16b;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .file-btn input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f8f9ff;
      border: 1px solid #d8e0ff;
      min-height: 52px;
      font-weight: 600;
    }

    .result {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #fff5dd;
      border: 1px solid #ffd983;
      font-size: 1.1rem;
      font-weight: 800;
      min-height: 52px;
    }

    .error {
      background: #ffe9e9;
      border-color: #ffb8b8;
      color: #9a1e1e;
    }

    .small {
      font-size: 0.9rem;
      color: #536083;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="입체도형 분류 앱">
    <section class="card">
      <h1>원기둥 · 원뿔 · 구 분류기</h1>
      <p>카메라로 찍거나 사진을 올려서 도형을 분류해요.</p>
      <div class="notice" role="note" aria-label="개인정보 안내">
        안내: 사진과 카메라 영상은 <strong>외부 서버로 전송되지 않고</strong>, 이 기기 브라우저 안에서만 처리됩니다.
      </div>
      <div id="modelStatus" class="status" role="status" aria-live="polite">모델 로딩 준비 중...</div>
      <div id="errorStatus" class="status error" role="alert" hidden></div>
    </section>

    <section class="media-grid" aria-label="입력 방식">
      <article class="card" aria-label="카메라 입력">
        <h2>카메라로 찍기</h2>
        <div class="preview-wrap" aria-label="카메라 미리보기 영역">
          <video id="cameraPreview" playsinline muted aria-label="실시간 카메라 화면"></video>
        </div>
        <div class="controls">
          <button id="startCameraBtn" class="btn btn-primary" type="button" aria-label="카메라 시작">카메라 시작</button>
          <button id="captureBtn" class="btn btn-neutral" type="button" aria-label="현재 화면 촬영" disabled>현재 화면 촬영</button>
          <button id="stopCameraBtn" class="btn btn-danger" type="button" aria-label="카메라 중지" disabled>카메라 중지</button>
        </div>
        <p class="small">카메라 권한을 허용해야 촬영할 수 있어요.</p>
      </article>

      <article class="card" aria-label="사진 업로드 입력">
        <h2>사진 올리기</h2>
        <div class="preview-wrap" aria-label="업로드한 사진 미리보기 영역">
          <img id="uploadPreview" alt="업로드한 사진 미리보기" hidden />
          <span id="uploadPlaceholder">아직 올린 사진이 없어요.</span>
        </div>
        <div class="controls">
          <label class="file-btn" aria-label="사진 파일 선택 버튼">
            사진 파일 선택
            <input
              id="imageInput"
              type="file"
              accept="image/*"
              capture="environment"
              aria-label="사진 파일 업로드"
            />
          </label>
        </div>
      </article>
    </section>

    <section class="card" aria-label="분류 결과">
      <h2>분류 결과</h2>
      <div id="resultBox" class="result" role="status" aria-live="polite">
        아직 분류하지 않았어요.
      </div>
      <p class="small">최고 확률이 0.7 미만이면 <strong>잘 모르겠어요</strong>라고 알려줘요.</p>
    </section>
  </main>

  <!-- Teachable Machine 표준 스크립트 (모델 로딩 앱 코드와 분리) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script>
    // ===== 앱 전체에서 쓰는 상태값 =====
    const MODEL_PATH = "./model.json";
    const METADATA_PATH = "./metadata.json";
    const CLASS_THRESHOLD = 0.7;

    const modelStatusEl = document.getElementById("modelStatus");
    const errorStatusEl = document.getElementById("errorStatus");
    const resultBoxEl = document.getElementById("resultBox");

    const cameraPreviewEl = document.getElementById("cameraPreview");
    const startCameraBtn = document.getElementById("startCameraBtn");
    const captureBtn = document.getElementById("captureBtn");
    const stopCameraBtn = document.getElementById("stopCameraBtn");

    const imageInputEl = document.getElementById("imageInput");
    const uploadPreviewEl = document.getElementById("uploadPreview");
    const uploadPlaceholderEl = document.getElementById("uploadPlaceholder");

    const captureCanvas = document.createElement("canvas");

    let model = null;
    let labelOrder = [];
    let cameraStream = null;

    // ===== 화면에 상태를 보기 쉽게 표시하는 함수 =====
    function setModelStatus(message) {
      modelStatusEl.textContent = message;
    }

    function setError(message) {
      if (!message) {
        errorStatusEl.hidden = true;
        errorStatusEl.textContent = "";
        return;
      }
      errorStatusEl.hidden = false;
      errorStatusEl.textContent = message;
    }

    // ===== metadata.json에서 라벨 순서를 읽는 함수 =====
    async function loadLabelOrder() {
      const response = await fetch(METADATA_PATH, { cache: "no-cache" });
      if (!response.ok) {
        throw new Error("metadata.json을 불러오지 못했어요.");
      }
      const metadata = await response.json();
      if (!Array.isArray(metadata.labels) || metadata.labels.length === 0) {
        throw new Error("metadata.json에 labels 정보가 없어요.");
      }
      return metadata.labels;
    }

    // ===== Teachable Machine 모델을 로드하는 함수 =====
    async function loadModel() {
      setModelStatus("모델을 불러오는 중이에요...");
      setError("");

      try {
        labelOrder = await loadLabelOrder();
        model = await tmImage.load(MODEL_PATH, METADATA_PATH);
        setModelStatus("모델 로딩 완료! 사진을 분류할 수 있어요.");
      } catch (error) {
        model = null;
        setModelStatus("모델 로딩에 실패했어요.");
        setError(`모델 파일(model.json, metadata.json, weights.bin)을 확인해 주세요. (${error.message})`);
      }
    }

    // ===== 예측 결과를 임계값 기준으로 표시하는 함수 =====
    function renderPredictionResult(best) {
      if (!best || best.probability < CLASS_THRESHOLD) {
        resultBoxEl.textContent = "잘 모르겠어요";
        return;
      }
      const percent = (best.probability * 100).toFixed(1);
      resultBoxEl.textContent = `${best.label} (${percent}%)`;
    }

    // ===== 모델 예측을 실행하는 함수 =====
    async function classifyImageElement(imageLikeElement) {
      if (!model) {
        setError("아직 모델이 준비되지 않았어요. 잠시 후 다시 시도해 주세요.");
        return;
      }

      try {
        setError("");
        resultBoxEl.textContent = "분류 중...";

        const predictions = await model.predict(imageLikeElement);
        const orderedPredictions = labelOrder.map((label) => {
          const found = predictions.find((item) => item.className === label);
          return {
            label,
            probability: found ? found.probability : 0
          };
        });

        const best = orderedPredictions.reduce((acc, cur) => {
          return cur.probability > acc.probability ? cur : acc;
        }, { label: "", probability: -1 });

        renderPredictionResult(best);
      } catch (error) {
        resultBoxEl.textContent = "분류에 실패했어요.";
        setError(`이미지 분석 중 오류가 발생했어요. (${error.message})`);
      }
    }

    // ===== 카메라 시작/중지/캡처 관련 함수 =====
    async function startCamera() {
      setError("");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setError("이 브라우저는 카메라 기능을 지원하지 않아요.");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        cameraStream = stream;
        cameraPreviewEl.srcObject = stream;
        await cameraPreviewEl.play();

        captureBtn.disabled = false;
        stopCameraBtn.disabled = false;
        startCameraBtn.disabled = true;
      } catch (error) {
        setError(`카메라를 시작할 수 없어요. 권한을 확인해 주세요. (${error.message})`);
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
      cameraPreviewEl.srcObject = null;
      captureBtn.disabled = true;
      stopCameraBtn.disabled = true;
      startCameraBtn.disabled = false;
    }

    async function captureFromCamera() {
      if (!cameraStream) {
        setError("먼저 카메라를 시작해 주세요.");
        return;
      }

      const width = cameraPreviewEl.videoWidth;
      const height = cameraPreviewEl.videoHeight;

      if (!width || !height) {
        setError("카메라 화면 준비 중이에요. 잠시 후 다시 눌러 주세요.");
        return;
      }

      captureCanvas.width = width;
      captureCanvas.height = height;
      const ctx = captureCanvas.getContext("2d");
      ctx.drawImage(cameraPreviewEl, 0, 0, width, height);

      await classifyImageElement(captureCanvas);
    }

    // ===== 파일 업로드 미리보기 + 분류 함수 =====
    async function handleImageUpload(file) {
      setError("");

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        setError("이미지 파일만 선택해 주세요.");
        return;
      }

      const imageUrl = URL.createObjectURL(file);
      uploadPreviewEl.src = imageUrl;
      uploadPreviewEl.hidden = false;
      uploadPlaceholderEl.hidden = true;

      try {
        await new Promise((resolve, reject) => {
          uploadPreviewEl.onload = () => resolve();
          uploadPreviewEl.onerror = () => reject(new Error("이미지를 불러오지 못했어요."));
        });

        await classifyImageElement(uploadPreviewEl);
      } catch (error) {
        setError(error.message);
      } finally {
        URL.revokeObjectURL(imageUrl);
      }
    }

    // ===== 이벤트 연결 =====
    startCameraBtn.addEventListener("click", startCamera);
    stopCameraBtn.addEventListener("click", stopCamera);
    captureBtn.addEventListener("click", captureFromCamera);

    imageInputEl.addEventListener("change", async (event) => {
      const [file] = event.target.files || [];
      await handleImageUpload(file);
      imageInputEl.value = "";
    });

    // ===== 페이지를 떠날 때 카메라 리소스를 정리 =====
    window.addEventListener("beforeunload", stopCamera);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        stopCamera();
      }
    });

    // ===== 앱 시작 =====
    loadModel();
  </script>
</body>
</html>
