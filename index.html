<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 스마트폰에서도 화면이 잘 보이도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 입체 도형 구별하기</title>
    <style>
        /* 전체 페이지 디자인 설정 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
        p { color: #666; }
        
        /* 버튼 디자인 */
        .btn-group { margin: 20px 0; }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background-color: #45a049; }
        button.active { background-color: #2E7D32; border: 2px solid #fff;}
        
        /* 화면(웹캠 및 사진)이 보여질 영역 디자인 */
        #display-area {
            margin: 20px auto;
            width: 300px;
            height: 300px;
            background-color: #ddd;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #webcam-container canvas { width: 100%; height: 100%; object-fit: cover; }
        #uploaded-image { max-width: 100%; max-height: 100%; display: none; }
        
        /* 사진 업로드 버튼(숨김 처리하고 디자인된 버튼으로 대체) */
        #image-upload { display: none; }
        
        /* 결과 텍스트 디자인 */
        #label-container {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            min-width: 250px;
        }
    </style>
</head>
<body>

    <h1>🔍 입체 도형 구별 앱</h1>
    <p>원기둥, 원뿔, 구를 카메라로 비추거나 사진을 올려보세요!</p>

    <!-- 모드 선택 버튼 -->
    <div class="btn-group">
        <button id="btn-webcam" class="active" onclick="startWebcam()">📷 카메라 사용</button>
        <button id="btn-image" onclick="document.getElementById('image-upload').click()">📁 사진 올리기</button>
        <!-- 브라우저 내부에서만 처리되므로 사진이 외부 서버로 전송되지 않습니다. -->
        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">
    </div>

    <!-- 카메라 화면 또는 업로드된 사진이 표시되는 곳 -->
    <div id="display-area">
        <div id="webcam-container"></div>
        <img id="uploaded-image" alt="업로드된 사진">
    </div>

    <!-- 인공지능 분석 결과가 표시되는 곳 -->
    <div id="label-container">AI 모델을 불러오는 중...</div>

    <!-- Teachable Machine 라이브러리 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script>
        // 사용자가 제공한 티처블 머신 모델 링크
        const URL = "https://teachablemachine.withgoogle.com/models/FqPNxW2We/";

        let model, webcam, maxPredictions;
        let isWebcamRunning = false;

        // 1. 모델 불러오기 (페이지가 열리면 가장 먼저 실행됨)
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 인공지능 모델 로드
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            
            // 모델 로드가 끝나면 바로 카메라 시작
            startWebcam();
        }

        // 2. 카메라 시작하기
        async function startWebcam() {
            document.getElementById('btn-webcam').classList.add('active');
            document.getElementById('btn-image').classList.remove('active');
            
            // 기존에 업로드된 사진 숨기기
            document.getElementById('uploaded-image').style.display = "none";
            document.getElementById('webcam-container').style.display = "block";
            document.getElementById("label-container").innerHTML = "카메라를 켜는 중...";

            // 카메라 설정 (너비, 높이, 좌우반전 여부)
            // 좌우 반전(거울 모드) 방지를 위해 세 번째 값을 false로 설정!
            const flip = false; 
            webcam = new tmImage.Webcam(300, 300, flip);
            
            try {
                // 스마트폰에서 후면 카메라를 우선적으로 사용하도록 시도
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                isWebcamRunning = true;
                
                // 화면에 카메라 영상 붙이기
                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                // 실시간 예측 반복 실행
                window.requestAnimationFrame(loop);
            } catch(e) {
                document.getElementById("label-container").innerHTML = "카메라 권한을 허용해주세요.";
            }
        }

        // 3. 실시간 카메라 영상 업데이트 루프
        async function loop() {
            if (isWebcamRunning) {
                webcam.update(); // 웹캠 프레임 업데이트
                await predict(webcam.canvas); // 캔버스 이미지를 AI로 분석
                window.requestAnimationFrame(loop); // 계속 반복
            }
        }

        // 4. 사진 파일 업로드 처리 (서버 전송 없이 브라우저 내부에서만 처리)
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 카메라가 켜져있다면 중지하기
            if (isWebcamRunning) {
                webcam.stop();
                isWebcamRunning = false;
            }

            // 버튼 색상 변경
            document.getElementById('btn-webcam').classList.remove('active');
            document.getElementById('btn-image').classList.add('active');

            // 화면 전환 (카메라 숨기고 사진 보이기)
            document.getElementById('webcam-container').style.display = "none";
            const imgElement = document.getElementById('uploaded-image');
            imgElement.style.display = "block";
            document.getElementById("label-container").innerHTML = "분석 중...";

            // 파일을 읽어서 화면에 띄우기 (FileReader 객체 사용 = 외부로 전송 안 됨)
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                // 이미지가 화면에 완전히 로드된 후 AI 분석 시작
                imgElement.onload = function() {
                    predict(imgElement);
                }
            };
            reader.readAsDataURL(file);
        }

        // 5. 인공지능 분석 및 결과 출력 함수
        async function predict(imageElement) {
            // 모델에 이미지(웹캠 또는 업로드된 사진)를 넣고 예측 결과 받아오기
            const prediction = await model.predict(imageElement);
            
            let maxProb = 0;
            let bestClassName = "";

            // 가장 확률이 높은 도형 찾기
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maxProb) {
                    maxProb = prediction[i].probability;
                    bestClassName = prediction[i].className;
                }
            }

            // 결과 화면에 띄우기 (확률이 0.7 미만이면 '잘 모르겠어요' 출력)
            if (maxProb < 0.7) {
                document.getElementById("label-container").innerHTML = "잘 모르겠어요 😕";
            } else {
                // 확률을 100분율로 변환 (예: 0.95 -> 95%)
                const percent = Math.round(maxProb * 100);
                document.getElementById("label-container").innerHTML = bestClassName + " (" + percent + "%)";
            }
        }

        // 페이지가 열리면 init 함수 실행
        init();
    </script>
</body>
</html>
