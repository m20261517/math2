<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="카메라 또는 사진으로 원기둥·원뿔·구를 인공지능으로 구별해 보는 학습 앱입니다." />
  <link rel="canonical" href="https://m20261517.github.io/math2/" />
  <title>원기둥·원뿔·구 구별하기</title>

  <!-- 티처블머신 이미지 모델을 실행하는 TensorFlow.js 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    /* 화면 전체의 기본 모양을 설정합니다. */
    :root {
      --main-color: #2563eb;
      --main-light: #dbeafe;
      --text-color: #1f2937;
      --background: #f8fafc;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      color: var(--text-color);
      background: linear-gradient(135deg, #eff6ff, var(--background));
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .container {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .card {
      padding: 24px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #1d4ed8;
      text-align: center;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    .description {
      line-height: 1.7;
      text-align: center;
    }

    .privacy {
      padding: 12px 16px;
      border-radius: 12px;
      color: #1e40af;
      background: var(--main-light);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    button,
    .upload-label {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: #ffffff;
      background: var(--main-color);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 0.15s, background 0.15s;
    }

    button:hover,
    .upload-label:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    #imageInput {
      display: none;
    }

    .preview-area {
      display: flex;
      min-height: 280px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px dashed #bfdbfe;
      border-radius: 16px;
      background: #f8fbff;
    }

    #webcam,
    #previewImage {
      display: block;
      width: 100%;
      max-width: 480px;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
    }

    #previewImage {
      display: none;
    }

    .placeholder {
      padding: 30px;
      color: #64748b;
      text-align: center;
    }

    #status {
      min-height: 28px;
      margin: 18px 0 8px;
      color: #475569;
      text-align: center;
      font-weight: 700;
    }

    #result {
      margin-top: 10px;
      padding: 20px;
      border-radius: 16px;
      background: #f1f5f9;
      text-align: center;
    }

    #prediction {
      margin: 0;
      color: #1d4ed8;
      font-size: clamp(1.6rem, 7vw, 2.5rem);
      font-weight: 800;
    }

    #confidence {
      margin: 8px 0 0;
      color: #475569;
    }

    .tips {
      margin: 20px 0 0;
      padding-left: 20px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      button,
      .upload-label {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🔎 원기둥·원뿔·구 구별하기</h1>
      <p class="description">
        카메라로 도형을 보여 주거나 사진을 올리면<br />
        인공지능이 어떤 입체도형인지 알려 줍니다.
      </p>

      <!-- 사진과 카메라 데이터는 브라우저 안에서만 처리됩니다. -->
      <p class="privacy">
        🔒 <strong>개인정보 보호:</strong> 사진은 인터넷이나 서버로 전송하지 않고,
        이 웹페이지 안에서만 분석합니다.
      </p>

      <!-- 카메라 시작, 카메라 종료, 사진 선택 기능을 제공합니다. -->
      <div class="controls">
        <button id="startCameraButton" type="button">📷 카메라 시작</button>
        <button id="stopCameraButton" type="button" disabled>⏹ 카메라 끄기</button>
        <label class="upload-label" for="imageInput">🖼️ 사진 올리기</label>
        <input id="imageInput" type="file" accept="image/*" />
      </div>

      <!-- 카메라 영상 또는 사용자가 선택한 사진을 보여 주는 영역입니다. -->
      <div class="preview-area">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="previewImage" alt="분석할 사진 미리보기" />
        <div id="placeholder" class="placeholder">
          카메라를 시작하거나 사진을 올려 주세요.
        </div>
      </div>

      <p id="status" role="status" aria-live="polite">AI 모델을 준비하고 있습니다...</p>

      <!-- 예측 결과와 확률을 표시합니다. -->
      <div id="result" aria-live="polite">
        <p id="prediction">아직 결과가 없어요</p>
        <p id="confidence">도형을 보여 주세요.</p>
      </div>

      <!-- 초등학교 6학년 학습에 도움이 되는 간단한 설명입니다. -->
      <ul class="tips">
        <li><strong>원기둥:</strong> 위와 아래가 같은 원이고 옆면이 둥글게 이어져요.</li>
        <li><strong>원뿔:</strong> 밑면은 원이고 뾰족한 꼭짓점이 하나 있어요.</li>
        <li><strong>구:</strong> 공처럼 둥글고 꼭짓점이나 모서리가 없어요.</li>
      </ul>
    </section>
  </main>

  <script>
    // 티처블머신 모델의 공유 주소입니다.
    // model.json과 metadata.json은 브라우저에서 직접 읽어 사용합니다.
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/FqPNxW2We/";

    // 웹페이지에서 사용할 요소들을 가져옵니다.
    const webcam = document.getElementById("webcam");
    const previewImage = document.getElementById("previewImage");
    const placeholder = document.getElementById("placeholder");
    const statusText = document.getElementById("status");
    const predictionText = document.getElementById("prediction");
    const confidenceText = document.getElementById("confidence");
    const imageInput = document.getElementById("imageInput");
    const startCameraButton = document.getElementById("startCameraButton");
    const stopCameraButton = document.getElementById("stopCameraButton");

    let model = null;
    let webcamStream = null;
    let isCameraRunning = false;
    let animationFrameId = null;

    // 모델을 한 번만 불러옵니다.
    async function loadModel() {
      if (model) return model;

      statusText.textContent = "AI 모델을 불러오는 중...";
      model = await tmImage.load(
        `${MODEL_URL}model.json`,
        `${MODEL_URL}metadata.json`
      );
      statusText.textContent = "준비 완료! 카메라를 시작하거나 사진을 올려 주세요.";
      return model;
    }

    // 화면에 표시할 미리보기 대상을 정리합니다.
    function showPreview(type) {
      if (type === "camera") {
        webcam.style.display = "block";
        previewImage.style.display = "none";
        placeholder.style.display = "none";
      } else if (type === "image") {
        webcam.style.display = "none";
        previewImage.style.display = "block";
        placeholder.style.display = "none";
      } else {
        webcam.style.display = "none";
        previewImage.style.display = "none";
        placeholder.style.display = "block";
      }
    }

    // 가장 확률이 높은 결과를 골라 화면에 표시합니다.
    // 확률이 0.7보다 작으면 확신하기 어려운 것으로 처리합니다.
    function displayPrediction(predictions) {
      if (!predictions || predictions.length === 0) return;

      const bestPrediction = predictions.reduce((best, current) =>
        current.probability > best.probability ? current : best
      );
      const probability = bestPrediction.probability;
      const percentage = (probability * 100).toFixed(1);

      if (probability < 0.7) {
        predictionText.textContent = "잘 모르겠어요 🤔";
        confidenceText.textContent = `가장 높은 확률: ${percentage}%`;
      } else {
        predictionText.textContent = bestPrediction.className;
        confidenceText.textContent = `확률: ${percentage}%`;
      }
    }

    // 카메라 영상이나 사진을 티처블머신 모델로 분석합니다.
    async function predict(target) {
      try {
        await loadModel();
        const predictions = await model.predict(target, false);
        displayPrediction(predictions);
      } catch (error) {
        console.error("이미지 분석 오류:", error);
        statusText.textContent = "이미지를 분석하지 못했어요. 다시 시도해 주세요.";
      }
    }

    // 카메라 영상을 계속 분석해 결과를 갱신합니다.
    async function predictCameraFrame() {
      if (!isCameraRunning) return;

      await predict(webcam);
      animationFrameId = requestAnimationFrame(predictCameraFrame);
    }

    // 사용자의 카메라 권한을 받아 카메라를 시작합니다.
    async function startCamera() {
      try {
        await loadModel();

        if (webcamStream) stopCamera();

        webcamStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        webcam.srcObject = webcamStream;
        isCameraRunning = true;
        startCameraButton.disabled = true;
        stopCameraButton.disabled = false;
        statusText.textContent = "카메라를 보고 있어요. 도형을 화면에 보여 주세요.";
        showPreview("camera");
        predictCameraFrame();
      } catch (error) {
        console.error("카메라 시작 오류:", error);
        statusText.textContent =
          "카메라를 사용할 수 없어요. 권한을 허용하거나 사진을 올려 주세요.";
      }
    }

    // 카메라의 모든 영상 장치를 정리합니다.
    function stopCamera() {
      isCameraRunning = false;
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;

      if (webcamStream) {
        webcamStream.getTracks().forEach((track) => track.stop());
        webcamStream = null;
      }

      webcam.srcObject = null;
      startCameraButton.disabled = false;
      stopCameraButton.disabled = true;
      statusText.textContent = "카메라를 껐어요. 사진을 올리거나 카메라를 다시 시작해 주세요.";

      if (!previewImage.src) showPreview("none");
    }

    // 사용자가 고른 사진을 브라우저에서만 읽고 바로 분석합니다.
    imageInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // 사진을 분석할 때 카메라가 켜져 있으면 먼저 종료합니다.
      if (isCameraRunning) stopCamera();

      const localImageUrl = URL.createObjectURL(file);
      previewImage.onload = async () => {
        showPreview("image");
        statusText.textContent = "사진을 분석하는 중...";
        await predict(previewImage);
        URL.revokeObjectURL(localImageUrl);
      };
      previewImage.src = localImageUrl;
    });

    // 버튼에 기능을 연결합니다.
    startCameraButton.addEventListener("click", startCamera);
    stopCameraButton.addEventListener("click", stopCamera);

    // 페이지가 닫힐 때 카메라가 계속 켜져 있지 않도록 정리합니다.
    window.addEventListener("beforeunload", stopCamera);

    // 페이지를 열면 모델을 미리 준비합니다.
    loadModel().catch((error) => {
      console.error("모델 로딩 오류:", error);
      statusText.textContent =
        "AI 모델을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.";
    });
  </script>
</body>
</html>
